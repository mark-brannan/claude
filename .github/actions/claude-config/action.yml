name: 'Seed Claude config from dotfiles'
description: >-
  Seed this job's $HOME with mark-brannan/dotfiles' Claude Code config
  (CLAUDE.md, rules, hooks, skills) so a Claude Code run in this checkout is
  gated by the same fail-closed hooks a real session runs under, instead of
  either having no config at all or a bespoke per-repo fetch step. Checks
  out dotfiles at `ref` and runs its own cloud-session-setup.sh installer --
  this action does not re-implement the install logic, only invokes it, so
  the two never drift.

  Design: https://github.com/mark-brannan/dotfiles/blob/main/.claude/docs/config-sync-strategy.md#64-ci-in-other-repos
  (issue #17, phase P3).

inputs:
  ref:
    description: >-
      git ref (branch, tag or full commit SHA) of mark-brannan/dotfiles to
      seed from. Defaults to `main` -- floating, not pinned. #17 P2 (a
      signed `claude-config/vN` release tag, reviewed and hardware-key
      signed before promotion) has not been built yet; once it lands, this
      default moves to the newest such tag instead of `main`. A caller that
      wants a pin today can already pass a full commit SHA here.
    required: false
    default: main

outputs:
  complete:
    description: >-
      "true" or "false", mirrored from the installer's own
      $HOME/.claude/.sync-status.json "complete" field. "false" (or this
      output being empty) means the install was partial or the status file
      never landed -- treat $HOME/.claude as untrustworthy.
    value: ${{ steps.status.outputs.complete }}

runs:
  using: composite
  steps:
    - name: Check out mark-brannan/dotfiles at ${{ inputs.ref }}
      uses: actions/checkout@v7
      with:
        repository: mark-brannan/dotfiles
        ref: ${{ inputs.ref }}
        path: .dotfiles-claude-config-seed
        persist-credentials: false

    # cloud-session-setup.sh is dotfiles' own installer, documented for
    # exactly this invocation shape (CLOUD_SESSION=1, a checkout at
    # $DOTFILES_SEED). It always exits 0 -- a missing dotfile must never
    # fail a cloud session or a CI job -- so the status file below, not this
    # step's exit code, is what says whether the install actually completed.
    - name: Run cloud-session-setup.sh
      shell: sh
      env:
        DOTFILES_SEED: ${{ github.workspace }}/.dotfiles-claude-config-seed
      run: |
        CLOUD_SESSION=1 sh "$DOTFILES_SEED/.local/bin/cloud-session-setup.sh"

    # The installer stages its own copy under $HOME/.claude-config, so the
    # seed is spent. Left in the caller's workspace it is a second copy of
    # dotfiles -- CLAUDE.md, hooks and all -- inside the repo a Claude run is
    # about to search and review.
    - name: Remove the spent seed checkout
      shell: sh
      env:
        DOTFILES_SEED: ${{ github.workspace }}/.dotfiles-claude-config-seed
      run: rm -rf "$DOTFILES_SEED"

    - name: Report install status
      id: status
      shell: sh
      run: |
        f="$HOME/.claude/.sync-status.json"
        if [ -f "$f" ]; then
          cat "$f"
          complete=$(grep -o '"complete": *[a-z]*' "$f" | grep -o '[a-z]*$')
          echo "complete=${complete:-false}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "::warning::cloud-session-setup.sh reported an incomplete install -- \$HOME/.claude is a partial set, not old-or-new"
          fi
        else
          echo "::warning::no $f after seeding -- installer did not run or failed before writing status"
          echo "complete=false" >> "$GITHUB_OUTPUT"
        fi
