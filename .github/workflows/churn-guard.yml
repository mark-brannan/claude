name: Churn guard

# Fails a PR that changes more scripts, or more script lines, than a reviewer
# can read in one sitting. Tests and docs don't count. A human's `churn-ok`
# label waives it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: churn-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  churn:
    runs-on: ubuntu-latest
    env:
      BUDGET: 150
      # Whole-name match: a substring match let "x churn-ok y" pass.
      WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'churn-ok') }}
      # Through env, never interpolated into shell: injection.
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Script count and line budget
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base="origin/$BASE_REF"
          gated=$(mktemp)
          changed=$(mktemp)

          # Gated: any file with a shebang, plus every .jq and .py.
          git diff --name-only --diff-filter=d "$base...HEAD" > "$changed"
          { grep -vE '\.test\.[a-z]+$|\.examples\.sh$|(^|/)tests/|(^|/)test_[^/]*\.py$' "$changed" \
              || [ $? -eq 1 ]; } \
            | while IFS= read -r f; do
                case "$f" in
                  *.jq|*.py) printf '%s\n' "$f"; continue ;;
                esac
                # `|| true` inside: head's early close SIGPIPEs git under pipefail.
                sig=$(git show "HEAD:$f" 2>/dev/null | head -c 2 || true)
                case "$sig" in
                  '#!') printf '%s\n' "$f" ;;
                esac
              done > "$gated"

          if [ ! -s "$gated" ]; then
            echo "ok: no script touched"
            exit 0
          fi

          count=$(wc -l < "$gated")
          mapfile -t paths < "$gated"
          lines=$(git --literal-pathspecs diff --numstat "$base...HEAD" -- "${paths[@]}" \
            | awk '{ a += $1 + $2 } END { print a + 0 }')
          echo "scripts touched ($count):"
          sed 's/^/  /' "$gated"
          echo "changed lines: $lines (budget $BUDGET)"

          over=""
          if [ "$count" -gt 3 ]; then
            over="$over $count scripts in one PR;"
          fi
          if [ "$lines" -gt "$BUDGET" ]; then
            over="$over $lines changed lines over the budget of $BUDGET;"
          fi
          if [ -z "$over" ]; then
            echo "ok: within the churn budget"
            exit 0
          fi

          if [ "$WAIVED" = true ]; then
            echo "::notice::over budget ($over ) -- allowed by the churn-ok label"
            exit 0
          fi

          echo "::error::churn over budget:$over"
          echo "Split it, smallest piece first, or state the overrun in the PR body."
          echo "https://github.com/mark-brannan/dotfiles/issues/149"
          exit 1
