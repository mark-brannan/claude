name: Secret scan

# gitleaks and trufflehog over full history, on every push. Shared via
# mark-brannan/.github; the ruleset requires both contexts directly.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"

# Superseded push runs are cancelled; the weekly run never is.
concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  secret-scan:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
