name: CI

# Every gating job fans into `ci-gate`, so the ruleset requires one context:
# `ci-gate / gate`. Add a job here, then add it to the gate's `needs`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The jobs below down to tool-tests are ported from dotfiles' ci.yml, which
  # holds the reasoning for each; they run the copied layer's suites here.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck --severity=warning hooks/*.sh cloud-setup.sh bin/*.sh

  # Every hook settings.json references is seeded by cloud-session-setup.sh
  # from INSTALL. The check compares the lists, not the files on disk.
  seeded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every settings.json hook is in INSTALL
        run: |
          set -euo pipefail
          { grep -o '\.claude/hooks/[A-Za-z0-9._-]*\.sh' settings.json \
              | sed 's|^\.claude/||'
            grep -ho 'lib-[A-Za-z0-9._-]*\.\(awk\|sh\|jq\)' hooks/*.sh \
              | sed 's|^|hooks/|'
            ls lib/*.py | grep -v '\.test\.py$'
          } | sort -u > /tmp/referenced
          sed -n '/^INSTALL="/,/^"/p' bin/cloud-session-setup.sh \
            | grep -o '^\(hooks\|lib\)/[A-Za-z0-9._-]*\.\(sh\|awk\|jq\|py\)' \
            | sort -u > /tmp/installed
          missing=$(comm -23 /tmp/referenced /tmp/installed)
          if [ -n "$missing" ]; then
            echo "::error::settings.json references hooks, or lib/ has files, that cloud-session-setup.sh never seeds:"
            echo "$missing"
            exit 1
          fi
          echo "ok: all $(wc -l < /tmp/referenced) referenced hooks and lib files are seeded"
      - name: settings.json hooks run from \$HOME only
        run: |
          set -euo pipefail
          if grep -q 'CLAUDE_PROJECT_DIR/.claude/hooks' settings.json; then
            echo "::error::settings.json falls back to \$CLAUDE_PROJECT_DIR for a hook."
            exit 1
          fi
          echo "ok: no \$CLAUDE_PROJECT_DIR hook fallbacks"

  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q jq
      # npm-publish-auth and pr-ownership-context read commands through the
      # languette plugin's scanner; their suites run it from a pinned languette
      # release (v0.0.2, the first with `scan`), bumped with the plugin, so a
      # push to languette's main never runs here unreviewed.
      # Cost per push: one single-commit fetch, a few seconds.
      - name: Check out languette
        env:
          LANGUETTE_SHA: 58ae556736afaacf0b0ea65dabc86384d5e17b74
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/languette"
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/mark-brannan/languette "$LANGUETTE_SHA"
          git -C "$d" checkout -q FETCH_HEAD
      - name: Python test suites
        run: for t in bin/*.test.py hooks/*.test.py lib/*.test.py; do echo "== $t"; python3 "$t"; done
      - name: Run every other test suite in parallel
        env:
          LANGUETTE_ROOT: ${{ runner.temp }}/languette
        run: |
          set -euo pipefail
          printf '%s\n' hooks/*.test.sh bin/*.test.sh \
            | xargs -P 4 -I{} bash -c '
                t="$1"
                echo "::group::$t"
                if bash "$t"; then echo "ok"; else echo "::error::$t failed"; exit 1; fi
                echo "::endgroup::"
              ' _ {}

  # Gherkin scenarios on pytest-bdd: features/<hook>.feature, each scenario a
  # row of hooks/<hook>-requirements.md's acceptance table, driven by
  # tests/conftest.py; tests/test_acceptance_ids.py checks the join.
  # Cost per push: one job, a pip install and under two seconds of pytest.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q jq
      - run: python3 -m pip install -q -r requirements-dev.txt
      - run: python3 -m pytest tests -q -p no:cacheprovider

  # settings.json must not set a languette option key plugin.json (on main)
  # no longer defines: the plugin ignores it and the guard goes off silently.
  # Cost per push: one ~3 KB raw.githubusercontent.com fetch, ~5s, one job.
  languette-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every languette option in settings.json is defined by the plugin
        run: python3 bin/languette-options-check

  nonempty:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  pr-title:
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/pr-title.yml@main

  # A measurement, not a gate, so it stays out of ci-gate's needs.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  ci-gate:
    needs: [shellcheck, seeded, tool-tests, features, languette-options, nonempty, pr-title]
    if: always()
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
