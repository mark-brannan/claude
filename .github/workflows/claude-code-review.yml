name: Claude PR Review

# Advisory reviewer, shared via mark-brannan/.github. Needs the
# CLAUDE_CODE_OAUTH_TOKEN repo secret; without it the review skips with a
# warning instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # The fixer job commits the review's [easy] fixes as the agent App;
      # unset, it skips with a warning.
      AGENT_BOT_APP_ID: ${{ secrets.AGENT_BOT_APP_ID }}
      AGENT_BOT_PRIVATE_KEY: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
    with:
      # Overriding replaces the default list, so restate it with claude[bot] and
      # the mark-brannan-agent App local sessions post as.
      allowed-bots: mergify[bot],mark-brannan-release-please[bot],claude[bot],mark-brannan-agent[bot]
      # This repo is installed as ~/.claude, so its hooks and settings sit at
      # the root, not under .claude/ where the shared triage looks for them.
      risky-paths: |
        hooks/*
        settings.json
        settings.*.json
      # The shared default grants npm ci/test, which would run a PR's own code;
      # an empty value keeps it off. No package.json exists here today.
      allowed-tools: ''
