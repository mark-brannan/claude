name: Claude PR Review

# Advisory reviewer, shared via mark-brannan/.github. Needs the
# CLAUDE_CODE_OAUTH_TOKEN repo secret; without it the review skips with a
# warning instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Overriding replaces the default list, so restate it with claude[bot] and
      # the mark-brannan-agent App local sessions post as.
      allowed-bots: mergify[bot],mark-brannan-release-please[bot],claude[bot],mark-brannan-agent[bot]
      # This repo is installed as ~/.claude, so its hooks and settings sit at
      # the root, not under .claude/ where the shared triage looks for them.
      risky-paths: |
        hooks/*
        settings.json
        settings.*.json
      # The critical-review skill from the seeded $HOME does the review (claude#296).
      prompt: |
        Run the critical-review skill on this pull request: invoke the Skill
        tool with skill "critical-review" and the PR's URL as args, and follow
        it. You are headless in CI, so three of its steps change: you cannot
        spawn a sub-agent, so when the models step names a reviewer family
        other than yours, say so in the summary and review anyway; you cannot
        reach the state repo, so a finding the skill would card becomes a PR
        thread; and the summary goes in one top-level `gh pr comment`.
        Findings go as inline comments via
        mcp__github_inline_comment__create_inline_comment. Do not push
        commits or edit files.
      allowed-tools: Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3 ~/.claude/lib/critical_review.py reviewer:*),Bash(~/.claude/bin/pr-blockers:*)
      timeout-minutes: 15
