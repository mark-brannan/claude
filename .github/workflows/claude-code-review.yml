name: Claude PR Review

# Advisory reviewer, shared via mark-brannan/.github. Needs the
# CLAUDE_CODE_OAUTH_TOKEN repo secret; without it the review skips with a
# warning instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Overriding replaces the default list, so restate it with claude[bot].
      allowed-bots: mergify[bot],mark-brannan-release-please[bot],claude[bot]
      prompt: |
        Review this pull request to a public repo holding a Claude Code layer:
        hooks, skills and settings that run unattended inside an agent session.
        Attack surface worth extra scrutiny: anything that executes
        automatically (hooks), anything that widens permissions, anything that
        fetches and executes remote content, and any credential, hostname or
        personal identifier in the diff. Otherwise review for correctness bugs
        and clear simplification opportunities. Skip pure style nits. Post
        inline comments on specific lines, then a short summary; say so briefly
        if you find nothing.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
      timeout-minutes: 15
